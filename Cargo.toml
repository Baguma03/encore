[package]
name = "encore"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "encore"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
egui = "0.37"
egui-wgpu = "0.37"
wgpu = "30"
pollster = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "6"
log = "0.4.21"
simple_logger = { version = "1.11", default-features = false, features = ["colors"] }
mpd = "0.1.0"
toml = "1.1.8"
